name = "missao-bahia-dashboard"
main = "./src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# ID da base "Base de candidatos" no Notion (com ou sem hifens).
NOTION_DATABASE_ID = "3c14f290d5c480d7b649ee415cf17433"

# Título exibido no topo do dashboard.
DASHBOARD_TITLE = "Missão Bahia"
DASHBOARD_SUBTITLE = "Base de candidatos"

# Valores tratados como concluído / não aplicável, separados por vírgula.
# A comparação ignora acentos, maiúsculas e pontuação.
DONE_VALUES = "feito,assinado,concluido,concluida,pago,ok,sim,pronto,enviado,emitido,finalizado"
NA_VALUES = "nao precisa,nao se aplica,n/a,na,nao aplicavel,dispensado"

# O NOTION_TOKEN NÃO fica aqui. Ele entra como secret:
#   npx wrangler secret put NOTION_TOKEN
