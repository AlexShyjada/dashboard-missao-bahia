# Alternativa à Netlify. O deploy documentado no README é o da Netlify;
# isto fica aqui caso um dia valha migrar: npx wrangler deploy
#
# Os padrões (ID da base, títulos, DONE_VALUES, NA_VALUES) vivem em
# src/config.js e valem para os dois hosts. Sobrescreva aqui só se precisar.
name = "missao-bahia-dashboard"
main = "./src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# O NOTION_TOKEN não fica aqui. Ele entra como secret:
#   npx wrangler secret put NOTION_TOKEN
