<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Missão Bahia · Base de candidatos</title>
<style>
  :root {
    color-scheme: light;
    --plane:      #f9f9f7;
    --surface-1:  #fcfcfb;
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --muted:      #898781;
    --grid:       #e1e0d9;
    --axis:       #c3c2b7;
    --border:     rgba(11, 11, 11, 0.10);
    --accent:     #2a78d6;
    --track:      #eceae4;

    --st-done:    #0ca30c;
    --st-done-2:  #0a7f0a;
    --st-done-3:  #085f08;
    /* Documento pronto, ainda sem assinatura: azul, para não ler como "quase
       concluído" (o que o verde clareado sugeria) nem colidir com o amarelo
       de pendente. */
    --st-partial: #2a78d6;
    --st-part-2:  #1f5aa8;
    --st-pending: #fab219;
    --st-pend-2:  #d99400;
    --st-pend-3:  #b87a00;
    --st-na:      #898781;
    --st-na-2:    #6f6e69;
    --st-empty:   #c3c2b7;

    --radius:     14px;
    --shadow:     0 1px 2px rgba(11,11,11,0.04), 0 8px 24px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:      #0d0d0d;
      --surface-1:  #1a1a19;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --muted:      #898781;
      --grid:       #2c2c2a;
      --axis:       #383835;
      --border:     rgba(255, 255, 255, 0.10);
      --accent:     #3987e5;
      --track:      #262624;

      --st-done:    #0ca30c;
      --st-done-2:  #14c014;
      --st-done-3:  #5cd45c;
      --st-partial: #3987e5;
      --st-part-2:  #6fb0f0;
      --st-pending: #fab219;
      --st-pend-2:  #d99400;
      --st-pend-3:  #f7cd6b;
      --st-na:      #898781;
      --st-na-2:    #a5a39c;
      --st-empty:   #4a4a46;
      --shadow:     0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d; --surface-1: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10); --accent: #3987e5; --track: #262624;
    --st-done: #0ca30c; --st-done-2: #14c014; --st-done-3: #5cd45c;
    --st-partial: #3987e5; --st-part-2: #6fb0f0;
    --st-pending: #fab219; --st-pend-2: #d99400; --st-pend-3: #f7cd6b;
    --st-na: #898781; --st-na-2: #a5a39c; --st-empty: #4a4a46;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.28);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--plane);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------------------------------------------------------------- header */
  header.top {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 16px; margin-bottom: 24px;
  }
  .title { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
           color: var(--muted); font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 12px;
    font-size: 13px; color: var(--ink-2);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st-done); flex: none; }
  .dot.live { animation: pulse 2.4s ease-in-out infinite; }
  .dot.stale { background: var(--st-pending); animation: none; }
  .dot.error { background: #d03b3b; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

  button.ghost {
    font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
  }
  button.ghost:hover { background: var(--track); }
  button.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost:disabled { opacity: 0.55; cursor: default; }

  /* ------------------------------------------------------------------ hero */
  .hero {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 24px 26px; margin-bottom: 20px;
    display: grid; grid-template-columns: minmax(200px, 260px) 1fr;
    gap: 16px 36px; align-items: center;
  }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; gap: 22px; } }
  .hero-figure { min-width: 0; }
  .hero-label { font-size: 13px; color: var(--ink-2); margin: 0 0 4px; }
  .hero-value { font-size: 56px; line-height: 1; font-weight: 660; letter-spacing: -0.03em; margin: 0; }
  .hero-value span { font-size: 26px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .hero-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .hero-meter { min-width: 0; }
  .meter-track {
    height: 10px; border-radius: 5px; background: var(--track);
    overflow: hidden; margin-bottom: 8px;
  }
  .meter-fill {
    height: 100%; border-radius: 0 4px 4px 0; background: var(--accent);
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 8px 22px; margin-top: 18px;
  }
  .stat { min-width: 0; }
  .stat b { display: block; font-size: 20px; font-weight: 620; letter-spacing: -0.01em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.is-text b { font-size: 15px; line-height: 1.25; white-space: normal;
                    overflow: visible; padding-top: 2px; }
  .stat small { font-size: 12px; color: var(--muted); display: block; line-height: 1.3; }

  /* ------------------------------------------------------------ stage cards */
  h2.section {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 30px 0 12px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(324px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 16px;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: var(--accent); }
  .card.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .step-no {
    font-size: 11px; font-weight: 700; color: var(--muted);
    font-variant-numeric: tabular-nums; flex: none;
  }
  .card-title { font-size: 15px; font-weight: 620; margin: 0; letter-spacing: -0.01em;
                line-height: 1.25; }
  .card-head { min-height: 2.5em; }
  .card-value { font-size: 19px; font-weight: 640; letter-spacing: -0.01em;
                flex: none; white-space: nowrap; }
  .card-value small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .card-note {
    font-size: 12px; color: var(--ink-2); margin: 10px 0 0;
    display: flex; align-items: center; gap: 6px;
  }
  .card-note .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .card-note b { font-weight: 620; font-variant-numeric: tabular-nums; color: var(--ink); }
  .card-prop {
    font-size: 11.5px; color: var(--muted); margin: 2px 0 14px 20px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .bar { display: flex; gap: 2px; height: 18px; border-radius: 4px; overflow: hidden; }
  .seg { min-width: 3px; cursor: default; transition: width .45s cubic-bezier(.4,0,.2,1); }
  .seg:first-child { border-radius: 4px 0 0 4px; }
  .seg:last-child  { border-radius: 0 4px 4px 0; }
  .seg:only-child  { border-radius: 4px; }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .lg .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .lg .ic { width: 12px; height: 12px; flex: none; color: var(--muted); }
  .lg b { font-weight: 620; font-variant-numeric: tabular-nums; color: var(--ink); }
  .lg .pc { color: var(--muted); font-variant-numeric: tabular-nums; }

  .missing {
    font-size: 12.5px; color: var(--ink-2); background: var(--track);
    border-radius: 8px; padding: 10px 12px; margin-top: 4px;
  }

  /* ---------------------------------------------------------------- gráfico */
  .chart { background: var(--surface-1); border: 1px solid var(--border);
           border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px 16px; }
  .chart-row { padding: 9px 0; }
  .chart-row + .chart-row { border-top: 1px solid var(--grid); }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline;
                gap: 12px; font-size: 13px; margin-bottom: 6px; }
  .chart-label { color: var(--ink); font-weight: 560; min-width: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-value { color: var(--ink-2); font-variant-numeric: tabular-nums; flex: none; white-space: nowrap; }
  .chart-value b { color: var(--ink); font-weight: 640; }
  .chart-track { position: relative; height: 14px; }
  .chart-grid { position: absolute; inset: 0; display: flex; justify-content: space-between; pointer-events: none; }
  .chart-grid span { width: 1px; height: 100%; background: var(--grid); }
  .chart-bar {
    position: relative; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0;
    background: var(--accent); cursor: default;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .chart-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chart-axis {
    display: flex; justify-content: space-between; margin-top: 10px;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* --------------------------------------------------------------- pendência */
  .pending-list { display: flex; flex-direction: column; gap: 10px; }
  .pending-empty {
    font-size: 13.5px; color: var(--ink-2); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 18px; margin: 0;
  }
  .prow {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 13px 16px; display: flex; align-items: flex-start; gap: 13px;
  }
  .prow-avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    object-fit: cover; background: var(--track); color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 640;
  }
  .prow-avatar-btn {
    flex: none; width: 42px; height: 42px; padding: 0; margin: 0;
    border: none; border-radius: 50%; background: none; cursor: pointer;
    position: relative;
  }
  .prow-avatar-btn:hover .prow-avatar,
  .prow-avatar-btn:focus-visible .prow-avatar { box-shadow: 0 0 0 2px var(--accent); }
  .prow-body { min-width: 0; flex: 1; }
  .prow-name { font-size: 14.5px; font-weight: 620; margin: 0 0 2px; letter-spacing: -0.01em; }
  .prow-name-link { color: inherit; text-decoration: none; }
  .prow-name-link:hover { color: var(--accent); text-decoration: underline; }

  /* ------------------------------------------------------------- photo modal */
  .photo-modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-modal[hidden] { display: none; }
  .photo-modal-backdrop {
    position: absolute; inset: 0; background: rgba(11, 11, 11, 0.72);
  }
  .photo-modal-dialog {
    position: relative; z-index: 1; max-width: min(92vw, 560px); max-height: 86vh;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .photo-modal-img {
    max-width: 100%; max-height: 68vh; border-radius: 10px;
    object-fit: contain; background: var(--surface-1);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .photo-modal-close {
    position: absolute; top: -14px; right: -14px; z-index: 2;
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--ink); font-size: 15px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .photo-modal-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--ink); font-size: 20px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .photo-modal-nav:hover { background: var(--track); }
  .photo-modal-nav[hidden] { display: none; }
  .photo-modal-prev { left: -16px; }
  .photo-modal-next { right: -16px; }
  .photo-modal-footer {
    display: flex; align-items: center; gap: 14px; color: var(--ink-2); font-size: 13px;
  }
  .photo-modal-download {
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
  }
  .photo-modal-download:hover { background: var(--track); }

  /* ------------------------------------------------------------- stage modal */
  .stage-modal {
    position: fixed; inset: 0; z-index: 100; padding: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-modal[hidden] { display: none; }
  .stage-modal-backdrop { position: absolute; inset: 0; background: rgba(11, 11, 11, 0.72); }
  .stage-modal-dialog {
    position: relative; z-index: 1; width: 100%; max-width: 560px; max-height: 82vh;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .stage-modal-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--border); flex: none;
  }
  .stage-modal-title { font-size: 15.5px; font-weight: 640; margin: 0; letter-spacing: -0.01em; }
  .stage-modal-count { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
  .stage-modal-close {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--ink); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .stage-modal-close:hover { background: var(--track); }
  .stage-modal-body { padding: 14px 16px 18px; overflow-y: auto; }
  .stage-modal-body .prow { box-shadow: none; }
  .stage-modal-empty { font-size: 13.5px; color: var(--ink-2); margin: 4px 0; }
  .prow-wpp {
    font-size: 12.5px; color: var(--ink-2); text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .prow-wpp:hover { color: var(--accent); text-decoration: underline; }
  .prow-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    color: var(--ink-2); background: var(--track); border-radius: 999px; padding: 4px 9px 4px 7px;
  }
  .tag .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tag .ic { width: 11px; height: 11px; flex: none; color: var(--ink-2); }

  /* --------------------------------------------------------------- estados */
  #app.loading { opacity: 0.45; }
  #app { transition: opacity .2s ease; }
  .banner {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 3px solid #d03b3b; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 18px; font-size: 13.5px; color: var(--ink-2);
  }
  .banner b { color: var(--ink); display: block; margin-bottom: 3px; }
  .banner code { background: var(--track); padding: 1px 5px; border-radius: 4px;
                 font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  footer.foot { margin-top: 34px; font-size: 12px; color: var(--muted); display: flex;
                justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer.foot a { color: var(--ink-2); }

  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%); transition: opacity .12s ease;
    background: var(--surface-1); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow); padding: 8px 11px;
    font-size: 12.5px; white-space: nowrap; max-width: 260px;
  }
  #tip.on { opacity: 1; }
  #tip .t-l { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  #tip .t-v { color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  #tip .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  @media (max-width: 560px) {
    .hero-value { font-size: 46px; }
    .subtitle { font-size: 22px; }
    .wrap { padding: 20px 14px 48px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="title" id="brand">Missão Bahia</p>
      <h1 class="subtitle" id="brand-sub">Base de candidatos</h1>
    </div>
    <div class="meta">
      <span class="pill"><span class="dot live" id="dot"></span><span id="freshness">carregando…</span></span>
      <button class="ghost" id="refresh" type="button">Atualizar</button>
    </div>
  </header>

  <div id="banner-slot"></div>

  <main id="app">
    <section class="hero">
      <div class="hero-figure">
        <p class="hero-label">Progresso geral da operação</p>
        <p class="hero-value" id="hero">—<span>%</span></p>
        <p class="hero-note" id="hero-note">Aguardando dados do Notion</p>
      </div>
      <div class="hero-meter">
        <div class="meter-track"><div class="meter-fill" id="hero-meter" style="width:0%"></div></div>
        <div class="meter-legend"><span>0%</span><span>100%</span></div>
        <div class="stat-row" id="hero-stats"></div>
      </div>
    </section>

    <h2 class="section">Progressão por etapa</h2>
    <div class="grid" id="cards"></div>

    <h2 class="section">Comparação entre etapas</h2>
    <div class="chart" id="chart"></div>

    <h2 class="section">Candidatos com pendência</h2>
    <div class="pending-list" id="pending"></div>
  </main>

  <footer class="foot">
    <span id="foot-left">Os dados vêm da base do Notion. Nome, foto e WhatsApp só aparecem para quem está com pendência.</span>
    <span id="foot-right"></span>
  </footer>
</div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<div id="photo-modal" class="photo-modal" hidden>
  <div class="photo-modal-backdrop" data-photo-close></div>
  <div class="photo-modal-dialog" role="dialog" aria-modal="true" aria-label="Foto do candidato">
    <button type="button" class="photo-modal-close" data-photo-close aria-label="Fechar">✕</button>
    <button type="button" class="photo-modal-nav photo-modal-prev" id="photo-modal-prev" aria-label="Foto anterior">‹</button>
    <img class="photo-modal-img" id="photo-modal-img" src="" alt="" />
    <button type="button" class="photo-modal-nav photo-modal-next" id="photo-modal-next" aria-label="Próxima foto">›</button>
    <div class="photo-modal-footer">
      <span class="photo-modal-count" id="photo-modal-count"></span>
      <button type="button" class="photo-modal-download" id="photo-modal-download">Baixar foto</button>
    </div>
  </div>
</div>

<div id="stage-modal" class="stage-modal" hidden>
  <div class="stage-modal-backdrop" data-stage-close></div>
  <div class="stage-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="stage-modal-title">
    <div class="stage-modal-head">
      <div>
        <h3 class="stage-modal-title" id="stage-modal-title"></h3>
        <p class="stage-modal-count" id="stage-modal-count"></p>
      </div>
      <button type="button" class="stage-modal-close" data-stage-close aria-label="Fechar">✕</button>
    </div>
    <div class="stage-modal-body" id="stage-modal-body"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ACTIVE_MS = 30000;      // varredura com alguem mexendo na pagina
  var IDLE_MS = 180000;       // varredura quando a aba fica esquecida aberta
  var IDLE_AFTER_MS = 300000; // 5 min sem interacao = aba esquecida
  var STALE_MS = 300000;      // acima disso o ponto fica ambar
  var MANUAL_COOLDOWN_MS = 5000;

  var els = {
    app: document.getElementById("app"),
    dot: document.getElementById("dot"),
    fresh: document.getElementById("freshness"),
    refresh: document.getElementById("refresh"),
    banner: document.getElementById("banner-slot"),
    brand: document.getElementById("brand"),
    brandSub: document.getElementById("brand-sub"),
    hero: document.getElementById("hero"),
    heroNote: document.getElementById("hero-note"),
    heroMeter: document.getElementById("hero-meter"),
    heroStats: document.getElementById("hero-stats"),
    cards: document.getElementById("cards"),
    chart: document.getElementById("chart"),
    pending: document.getElementById("pending"),
    footRight: document.getElementById("foot-right"),
    tip: document.getElementById("tip"),
    photoModal: document.getElementById("photo-modal"),
    photoImg: document.getElementById("photo-modal-img"),
    photoPrev: document.getElementById("photo-modal-prev"),
    photoNext: document.getElementById("photo-modal-next"),
    photoCount: document.getElementById("photo-modal-count"),
    photoDownload: document.getElementById("photo-modal-download"),
    stageModal: document.getElementById("stage-modal"),
    stageModalTitle: document.getElementById("stage-modal-title"),
    stageModalCount: document.getElementById("stage-modal-count"),
    stageModalBody: document.getElementById("stage-modal-body")
  };

  var lastData = null;
  var lastOkAt = 0;
  var lastInteractionAt = Date.now();
  var timer = null;

  // A Netlify suspende o site se passar de 125 mil invocacoes no mes. Uma aba
  // esquecida aberta num monitor consumiria isso sozinha, entao a varredura
  // desacelera quando ninguem esta mexendo e volta ao normal no primeiro toque.
  function isIdle() { return Date.now() - lastInteractionAt > IDLE_AFTER_MS; }
  function currentInterval() { return isIdle() ? IDLE_MS : ACTIVE_MS; }

  /* ------------------------------------------------------------- helpers */

  function pct(value) {
    if (value === null || value === undefined) return "—";
    return Math.round(value * 100) + "%";
  }

  function esc(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // A cor sai do "kind" (concluido / pendente / nao aplicavel / vazio).
  // Quando um kind tem mais de um rotulo, os seguintes usam um passo proprio
  // da mesma matiz; a legenda e a tabela desambiguam pelo nome.
  var RAMPS = {
    done:    ["--st-done", "--st-done-2", "--st-done-3"],
    partial: ["--st-partial", "--st-part-2"],
    pending: ["--st-pending", "--st-pend-2", "--st-pend-3"],
    na:      ["--st-na", "--st-na-2"],
    empty:   ["--st-empty"]
  };

  function paint(breakdown) {
    var seen = { done: 0, partial: 0, pending: 0, na: 0, empty: 0 };
    return breakdown.map(function (bucket) {
      var ramp = RAMPS[bucket.kind] || RAMPS.empty;
      var index = Math.min(seen[bucket.kind] || 0, ramp.length - 1);
      seen[bucket.kind] = (seen[bucket.kind] || 0) + 1;
      var copy = {};
      for (var k in bucket) copy[k] = bucket[k];
      copy.color = "var(" + ramp[index] + ")";
      return copy;
    });
  }

  // Icone por estado: a cor nunca carrega o significado sozinha.
  var ICONS = {
    done:    '<svg class="ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    partial: '<svg class="ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.7"/><path d="M8 2.3a5.7 5.7 0 010 11.4z" fill="currentColor"/></svg>',
    pending: '<svg class="ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.6V8l2.4 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    na:      '<svg class="ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    empty:   '<svg class="ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2.2"/></svg>'
  };
  var KIND_WORD = {
    done: "concluído", partial: "pronto, aguardando assinatura",
    pending: "pendente", na: "não se aplica", empty: "em branco"
  };

  /* -------------------------------------------------------------- tooltip */

  function showTip(event, bucket, total) {
    els.tip.innerHTML =
      '<div class="t-l"><span class="sw" style="background:' + bucket.color + '"></span>' + esc(bucket.label) + "</div>" +
      '<div class="t-v">' + bucket.count + " de " + total + " · " + pct(bucket.pct) + "</div>";
    var box = event.currentTarget.getBoundingClientRect();
    els.tip.style.left = (box.left + box.width / 2) + "px";
    els.tip.style.top = (box.top - 8) + "px";
    els.tip.classList.add("on");
    els.tip.setAttribute("aria-hidden", "false");
  }
  function hideTip() {
    els.tip.classList.remove("on");
    els.tip.setAttribute("aria-hidden", "true");
  }

  /* ------------------------------------------------------------ renderers */

  // Só as etapas que contam para o percentual geral aparecem na tela, numeradas
  // na ordem do fluxo. Marcadores de entrada (ex.: Aceitou Fundão) ficam de fora.
  function orderedStages(stages) {
    return stages.filter(function (s) { return !s.excludeFromOverall; })
      .map(function (s, i) { return { stage: s, step: String(i + 1) }; });
  }

  function renderCards(data) {
    els.cards.innerHTML = "";

    orderedStages(data.stages).forEach(function (entry) {
      var stage = entry.stage;
      var step = entry.step;
      var card = document.createElement("section");
      card.className = "card";

      if (!stage.propertyFound) {
        card.innerHTML =
          '<div class="card-head"><div class="card-name">' +
          '<span class="step-no">' + step + "</span>" +
          '<h3 class="card-title">' + esc(stage.label) + "</h3></div></div>" +
          '<p class="card-prop">&nbsp;</p>' +
          '<div class="missing">Coluna <b>' + esc(stage.property) + "</b> não encontrada na base. " +
          "Se ela foi renomeada no Notion, ajuste <code>STAGES</code> em <code>src/notion.js</code>.</div>";
        els.cards.appendChild(card);
        return;
      }

      var buckets = paint(stage.breakdown).filter(function (b) { return b.count > 0; });
      var head =
        '<div class="card-head">' +
          '<div class="card-name">' +
            '<span class="step-no">' + step + "</span>" +
            '<h3 class="card-title">' + esc(stage.label) + "</h3>" +
          "</div>" +
          '<div class="card-value">' + pct(stage.pct) +
            " <small>" + stage.done + "/" + stage.applicable + "</small></div>" +
        "</div>" +
        '<p class="card-prop">' + esc(stage.propertyName) + "</p>";

      var bar = document.createElement("div");
      bar.className = "bar";
      bar.setAttribute("role", "img");
      bar.setAttribute("aria-label",
        stage.label + ": " + buckets.map(function (b) { return b.count + " " + b.label; }).join(", "));

      buckets.forEach(function (bucket) {
        var seg = document.createElement("div");
        seg.className = "seg";
        seg.style.width = (bucket.pct * 100) + "%";
        seg.style.background = bucket.color;
        seg.tabIndex = 0;
        seg.addEventListener("mouseenter", function (e) { showTip(e, bucket, stage.total); });
        seg.addEventListener("focus", function (e) { showTip(e, bucket, stage.total); });
        seg.addEventListener("mouseleave", hideTip);
        seg.addEventListener("blur", hideTip);
        bar.appendChild(seg);
      });

      var legend = document.createElement("div");
      legend.className = "legend";
      legend.innerHTML = buckets.map(function (bucket) {
        return '<span class="lg" title="' + esc(bucket.label) + " — " + KIND_WORD[bucket.kind] + '">' +
          '<span class="sw" style="background:' + bucket.color + '"></span>' +
          (ICONS[bucket.kind] || "") +
          esc(bucket.label) + " <b>" + bucket.count + "</b>" +
          '<span class="pc">(' + pct(bucket.pct) + ")</span></span>";
      }).join("");

      card.innerHTML = head;
      card.appendChild(bar);
      card.appendChild(legend);

      // O card inteiro abre a lista de quem está pendente nesta etapa —
      // mesma fonte de dado da seção "Candidatos com pendência", filtrada.
      card.classList.add("clickable");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-haspopup", "dialog");
      card.setAttribute("aria-label", "Ver candidatos pendentes em " + stage.label);
      card.addEventListener("click", function () { openStageModal(stage); });
      card.addEventListener("keydown", function (event) {
        if (event.target !== card) return;
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openStageModal(stage); }
      });

      // Numa coluna de documento, o que trava a etapa é a assinatura.
      if (stage.requiresSignature && stage.partial > 0) {
        var note = document.createElement("p");
        note.className = "card-note";
        note.innerHTML =
          '<span class="sw" style="background:var(--st-partial)"></span>' +
          "<span><b>" + stage.partial + "</b> " +
          (stage.partial === 1 ? "documento pronto, esperando assinatura" :
                                 "documentos prontos, esperando assinatura") + "</span>";
        card.appendChild(note);
      }

      els.cards.appendChild(card);
    });
  }

  // Gráfico de barras horizontais: uma barra por etapa que conta, mesma cor
  // (é uma única medida — % concluído — comparada entre categorias), com
  // grade e eixo em 0/25/50/75/100% para leitura de magnitude, não um funil.
  function renderChart(data) {
    var rows = orderedStages(data.stages);

    els.chart.innerHTML = rows.map(function (entry) {
      var stage = entry.stage;
      var width = stage.pct === null || stage.pct === undefined ? 0 : stage.pct * 100;
      var value = stage.propertyFound
        ? "<b>" + pct(stage.pct) + "</b> (" + stage.done + "/" + stage.applicable + ")"
        : "sem dados";
      return '<div class="chart-row">' +
        '<div class="chart-head"><span class="chart-label">' + entry.step + ". " + esc(stage.label) + "</span>" +
        '<span class="chart-value">' + value + "</span></div>" +
        '<div class="chart-track">' +
          '<div class="chart-grid"><span></span><span></span><span></span><span></span><span></span></div>' +
          '<div class="chart-bar" data-stage="' + entry.step + '" style="width:' + width + '%"' +
            (stage.propertyFound ? ' tabindex="0"' : "") + "></div>" +
        "</div></div>";
    }).join("") +
    '<div class="chart-axis"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>';

    rows.forEach(function (entry) {
      if (!entry.stage.propertyFound) return;
      var bar = els.chart.querySelector('.chart-bar[data-stage="' + entry.step + '"]');
      if (!bar) return;
      var bucket = { color: "var(--accent)", label: entry.stage.label, count: entry.stage.done, pct: entry.stage.pct };
      bar.addEventListener("mouseenter", function (e) { showTip(e, bucket, entry.stage.applicable); });
      bar.addEventListener("focus", function (e) { showTip(e, bucket, entry.stage.applicable); });
      bar.addEventListener("mouseleave", hideTip);
      bar.addEventListener("blur", hideTip);
    });
  }

  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    var first = parts[0].charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
    return (first + last).toUpperCase();
  }

  // wa.me só aceita dígitos (com DDI); o texto mostrado continua o valor que
  // está no Notion, então quem confere sabe se falta o 55 ou o 9.
  function whatsappHref(raw) {
    var digits = String(raw || "").replace(/\D/g, "");
    return digits ? "https://wa.me/" + digits : null;
  }

  // Lista de quem ainda tem alguma etapa não fechada, ordenada pela API com
  // quem tem mais pendência primeiro. Nome, foto e WhatsApp só existem aqui.
  function renderPending(data) {
    var list = data.candidatesPending || [];

    if (!list.length) {
      els.pending.innerHTML =
        '<p class="pending-empty">Ninguém com pendência agora — todo mundo em dia nas etapas que contam.</p>';
      return;
    }

    els.pending.innerHTML = list.map(function (candidate, index) {
      var avatarInner = candidate.photoUrl
        ? '<img class="prow-avatar" data-name="' + esc(candidate.name || "") +
          '" src="' + esc(candidate.photoUrl) + '" alt="" />'
        : '<div class="prow-avatar">' + esc(initials(candidate.name)) + "</div>";

      var hasPhotos = candidate.photos && candidate.photos.length > 0;
      var avatar = hasPhotos
        ? '<button type="button" class="prow-avatar-btn" data-index="' + index +
          '" aria-label="Ver foto de ' + esc(candidate.name || "candidato") + '">' +
          avatarInner + "</button>"
        : avatarInner;

      var wppHref = whatsappHref(candidate.whatsapp);
      var wpp = !candidate.whatsapp ? "" :
        wppHref
          ? '<a class="prow-wpp" href="' + esc(wppHref) + '" target="_blank" rel="noopener">' + esc(candidate.whatsapp) + "</a>"
          : '<span class="prow-wpp">' + esc(candidate.whatsapp) + "</span>";

      var tags = candidate.pending.map(function (p) {
        var kind = p.status === "partial" ? "partial" : "pending";
        return '<span class="tag"><span class="sw" style="background:var(--st-' + kind + ')"></span>' +
          (ICONS[kind] || "") + esc(p.stageLabel) + "</span>";
      }).join("");

      var nameText = esc(candidate.name || "Sem nome");
      var name = candidate.notionUrl
        ? '<a class="prow-name-link" href="' + esc(candidate.notionUrl) + '" target="_blank" rel="noopener">' + nameText + "</a>"
        : nameText;

      return '<div class="prow">' + avatar +
        '<div class="prow-body"><p class="prow-name">' + name + "</p>" +
        wpp + '<div class="prow-tags">' + tags + "</div></div></div>";
    }).join("");

    // A URL de foto do Notion expira; se a imagem não carregar mais, cai para
    // o avatar de iniciais em vez de deixar o ícone quebrado na tela.
    els.pending.querySelectorAll("img.prow-avatar").forEach(function (img) {
      img.addEventListener("error", function () {
        var div = document.createElement("div");
        div.className = "prow-avatar";
        div.textContent = initials(img.getAttribute("data-name"));
        img.replaceWith(div);
      });
    });

    els.pending.querySelectorAll(".prow-avatar-btn").forEach(function (btn) {
      var candidate = list[Number(btn.getAttribute("data-index"))];
      btn.addEventListener("click", function () {
        openPhotoModal(candidate.photos, candidate.name);
      });
    });
  }

  /* --------------------------------------------------------------- foto modal */

  // Trava o scroll da página enquanto qualquer modal (foto ou etapa) estiver
  // aberto; libera só quando os dois estiverem fechados.
  function syncBodyScrollLock() {
    var locked = !els.photoModal.hidden || !els.stageModal.hidden;
    document.body.style.overflow = locked ? "hidden" : "";
  }

  var photoState = { photos: [], index: 0, name: "" };

  function updatePhotoModal() {
    var multi = photoState.photos.length > 1;
    els.photoImg.src = photoState.photos[photoState.index] || "";
    els.photoImg.alt = photoState.name ? "Foto de " + photoState.name : "";
    els.photoPrev.hidden = !multi;
    els.photoNext.hidden = !multi;
    els.photoCount.textContent = multi ? (photoState.index + 1) + " de " + photoState.photos.length : "";
  }

  function openPhotoModal(photos, name) {
    if (!photos || !photos.length) return;
    photoState = { photos: photos, index: 0, name: name || "" };
    updatePhotoModal();
    els.photoModal.hidden = false;
    syncBodyScrollLock();
  }

  function closePhotoModal() {
    els.photoModal.hidden = true;
    syncBodyScrollLock();
  }

  function navigatePhoto(delta) {
    var total = photoState.photos.length;
    if (!total) return;
    photoState.index = (photoState.index + delta + total) % total;
    updatePhotoModal();
  }

  function guessExtension(url) {
    try {
      var match = /\.([a-z0-9]{2,5})$/i.exec(new URL(url).pathname);
      return match ? match[1] : "jpg";
    } catch (e) { return "jpg"; }
  }

  // A URL de foto do Notion é de outra origem, então o atributo "download" sozinho
  // não força o salvamento — baixa como blob e cria o link; se o fetch falhar
  // (CORS), cai para abrir a foto numa nova aba para salvar manualmente.
  function downloadCurrentPhoto() {
    var url = photoState.photos[photoState.index];
    if (!url) return;
    var base = (photoState.name || "foto").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/gi, "-").toLowerCase().replace(/^-+|-+$/g, "") || "foto";
    var suffix = photoState.photos.length > 1 ? "-" + (photoState.index + 1) : "";
    var filename = base + suffix + "." + guessExtension(url);

    fetch(url)
      .then(function (response) { if (!response.ok) throw new Error("download falhou"); return response.blob(); })
      .then(function (blob) {
        var href = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = href;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(href); }, 4000);
      })
      .catch(function () { window.open(url, "_blank", "noopener"); });
  }

  els.photoPrev.addEventListener("click", function () { navigatePhoto(-1); });
  els.photoNext.addEventListener("click", function () { navigatePhoto(1); });
  els.photoDownload.addEventListener("click", downloadCurrentPhoto);
  els.photoModal.querySelectorAll("[data-photo-close]").forEach(function (elm) {
    elm.addEventListener("click", closePhotoModal);
  });
  document.addEventListener("keydown", function (event) {
    if (!els.photoModal.hidden) {
      if (event.key === "Escape") closePhotoModal();
      else if (event.key === "ArrowLeft") navigatePhoto(-1);
      else if (event.key === "ArrowRight") navigatePhoto(1);
      return;
    }
    if (!els.stageModal.hidden && event.key === "Escape") closeStageModal();
  });

  /* -------------------------------------------------------------- etapa modal */

  // Mesma fonte de dado da seção "Candidatos com pendência" (só quem tem
  // etapa não fechada), filtrada para a etapa clicada.
  function candidatesForStage(stageKey) {
    var list = (lastData && lastData.candidatesPending) || [];
    return list.reduce(function (acc, candidate) {
      var entry = candidate.pending.filter(function (p) { return p.stageKey === stageKey; })[0];
      if (entry) acc.push({ candidate: candidate, entry: entry });
      return acc;
    }, []);
  }

  function renderStageModalBody(rows) {
    if (!rows.length) {
      els.stageModalBody.innerHTML =
        '<p class="stage-modal-empty">Ninguém pendente nesta etapa — todo mundo em dia.</p>';
      return;
    }

    els.stageModalBody.innerHTML = '<div class="pending-list">' + rows.map(function (row, index) {
      var candidate = row.candidate;
      var kind = row.entry.status === "partial" ? "partial" : "pending";

      var avatarInner = candidate.photoUrl
        ? '<img class="prow-avatar" data-name="' + esc(candidate.name || "") +
          '" src="' + esc(candidate.photoUrl) + '" alt="" />'
        : '<div class="prow-avatar">' + esc(initials(candidate.name)) + "</div>";
      var hasPhotos = candidate.photos && candidate.photos.length > 0;
      var avatar = hasPhotos
        ? '<button type="button" class="prow-avatar-btn" data-index="' + index +
          '" aria-label="Ver foto de ' + esc(candidate.name || "candidato") + '">' +
          avatarInner + "</button>"
        : avatarInner;

      var wppHref = whatsappHref(candidate.whatsapp);
      var wpp = !candidate.whatsapp ? "" :
        wppHref
          ? '<a class="prow-wpp" href="' + esc(wppHref) + '" target="_blank" rel="noopener">' + esc(candidate.whatsapp) + "</a>"
          : '<span class="prow-wpp">' + esc(candidate.whatsapp) + "</span>";

      var nameText = esc(candidate.name || "Sem nome");
      var name = candidate.notionUrl
        ? '<a class="prow-name-link" href="' + esc(candidate.notionUrl) + '" target="_blank" rel="noopener">' + nameText + "</a>"
        : nameText;

      var tag = '<span class="tag"><span class="sw" style="background:var(--st-' + kind + ')"></span>' +
        (ICONS[kind] || "") + esc(KIND_WORD[kind]) + "</span>";

      return '<div class="prow">' + avatar +
        '<div class="prow-body"><p class="prow-name">' + name + "</p>" +
        wpp + '<div class="prow-tags">' + tag + "</div></div></div>";
    }).join("") + "</div>";

    els.stageModalBody.querySelectorAll("img.prow-avatar").forEach(function (img) {
      img.addEventListener("error", function () {
        var div = document.createElement("div");
        div.className = "prow-avatar";
        div.textContent = initials(img.getAttribute("data-name"));
        img.replaceWith(div);
      });
    });
    els.stageModalBody.querySelectorAll(".prow-avatar-btn").forEach(function (btn) {
      var row = rows[Number(btn.getAttribute("data-index"))];
      btn.addEventListener("click", function () {
        openPhotoModal(row.candidate.photos, row.candidate.name);
      });
    });
  }

  function openStageModal(stage) {
    var rows = candidatesForStage(stage.key);
    els.stageModalTitle.textContent = stage.label;
    els.stageModalCount.textContent = rows.length
      ? rows.length + (rows.length === 1 ? " candidato pendente" : " candidatos pendentes")
      : "";
    renderStageModalBody(rows);
    els.stageModal.hidden = false;
    syncBodyScrollLock();
  }

  function closeStageModal() {
    els.stageModal.hidden = true;
    syncBodyScrollLock();
  }

  els.stageModal.querySelectorAll("[data-stage-close]").forEach(function (elm) {
    elm.addEventListener("click", closeStageModal);
  });

  function renderHero(data) {
    els.hero.innerHTML = (data.overall.pct === null ? "—" : Math.round(data.overall.pct * 100)) + "<span>%</span>";
    els.heroMeter.style.width = (data.overall.pct ? data.overall.pct * 100 : 0) + "%";
    els.heroNote.textContent =
      "Média das " + data.overall.stages + " etapas que contam. Quem está como " +
      "\u201cNão precisa\u201d fica fora da conta.";

    var found = data.stages.filter(function (s) { return s.propertyFound && !s.excludeFromOverall; });

    // Gargalo = a etapa com a maior queda de concluidos em relacao a anterior.
    var worst = null;
    for (var i = 1; i < found.length; i += 1) {
      var drop = found[i - 1].done - found[i].done;
      if (!worst || drop > worst.drop) worst = { stage: found[i], drop: drop };
    }

    // Documentos prontos esperando assinatura, somando todas as etapas de
    // documento. Costuma ser o número mais acionável da tela.
    var awaiting = found.reduce(function (acc, s) {
      return acc + (s.requiresSignature ? (s.partial || 0) : 0);
    }, 0);

    els.heroStats.innerHTML =
      '<div class="stat"><b>' + data.totalCandidates + "</b><small>candidatos na base</small></div>" +
      (awaiting > 0
        ? '<div class="stat"><b style="color:var(--ink)">' + awaiting +
          "</b><small>" + (awaiting === 1 ? "documento esperando assinatura"
                                          : "documentos esperando assinatura") + "</small></div>"
        : "") +
      '<div class="stat"><b>' + data.overall.done + " <span style=\"font-weight:500;color:var(--muted)\">/ " +
        data.overall.applicable + "</span></b><small>marcações concluídas</small></div>" +
      (worst && worst.drop > 0
        ? '<div class="stat is-text" title="' + esc(worst.stage.label) + '"><b>' + esc(worst.stage.label) +
          "</b><small>maior gargalo (−" + worst.drop + " candidatos)</small></div>"
        : '<div class="stat"><b>' + found.length + "</b><small>etapas monitoradas</small></div>");
  }

  function renderFreshness() {
    if (!lastOkAt) return;
    var age = Date.now() - lastOkAt;
    var seconds = Math.round(age / 1000);
    var text = seconds < 60
      ? "atualizado há " + seconds + "s"
      : "atualizado há " + Math.round(seconds / 60) + " min";
    els.fresh.textContent = text + (isIdle() ? " · em espera" : "");
    els.dot.className = "dot " + (age > STALE_MS ? "stale" : "live");
  }

  function showBanner(message, hint) {
    els.banner.innerHTML =
      '<div class="banner"><b>Não consegui ler o Notion agora</b>' + esc(message) +
      (hint ? "<br />" + esc(hint) : "") +
      (lastData ? "<br />Mostrando os últimos dados que carregaram." : "") + "</div>";
    els.dot.className = "dot error";
    els.fresh.textContent = lastOkAt ? "dados desatualizados" : "sem dados";
  }

  /* ------------------------------------------------------------- carregar */

  function load(force) {
    els.app.classList.add("loading");
    var url = force ? "/api/stats?fresh=1" : "/api/stats";

    fetch(url, { headers: { accept: "application/json" }, cache: "no-store" })
      .then(function (response) { return response.json().catch(function () { return { ok: false, error: "Resposta inválida do servidor." }; }); })
      .then(function (data) {
        if (!data || !data.ok) {
          showBanner((data && data.error) || "Erro desconhecido.", data && data.hint);
          return;
        }
        lastData = data;
        lastOkAt = Date.now();
        els.banner.innerHTML = "";

        if (data.title) { els.brand.textContent = data.title; document.title = data.title + " · " + (data.subtitle || ""); }
        if (data.subtitle) els.brandSub.textContent = data.subtitle;
        els.footRight.innerHTML = data.databaseUrl
          ? '<a href="' + esc(data.databaseUrl) + '" target="_blank" rel="noopener">Abrir a base no Notion</a>'
          : "";

        renderHero(data);
        renderCards(data);
        renderChart(data);
        renderPending(data);
        renderFreshness();
      })
      .catch(function (error) { showBanner(String(error && error.message ? error.message : error)); })
      .finally(function () {
        els.app.classList.remove("loading");
        schedule();
      });
  }

  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      if (document.visibilityState === "visible" && Date.now() - lastOkAt >= currentInterval() - 1000) {
        load();
      } else {
        schedule();
      }
    }, currentInterval());
  }

  function noteInteraction() {
    var wasIdle = isIdle();
    lastInteractionAt = Date.now();
    // Saiu do modo ocioso com dado velho: busca na hora em vez de esperar.
    if (wasIdle && Date.now() - lastOkAt > ACTIVE_MS) load();
  }

  // O clique manual pula o cache de borda; o cooldown evita que a equipe
  // inteira martele o Notion ao mesmo tempo e tome 429.
  els.refresh.addEventListener("click", function () {
    if (els.refresh.disabled) return;
    els.refresh.disabled = true;
    els.refresh.textContent = "Atualizando…";
    load(true);
    setTimeout(function () {
      els.refresh.disabled = false;
      els.refresh.textContent = "Atualizar";
    }, MANUAL_COOLDOWN_MS);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    noteInteraction();
    if (Date.now() - lastOkAt > 10000) load();
  });
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (evt) {
    window.addEventListener(evt, noteInteraction, { passive: true });
  });
  window.addEventListener("scroll", hideTip, { passive: true });
  setInterval(renderFreshness, 1000);

  load();
})();
</script>
</body>
</html>
